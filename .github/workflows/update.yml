# 毎時13分に相場を取り込み、GitHub Pages に公開する
name: update

on:
  schedule:
    - cron: '13 * * * *'   # UTC。相場サイトの更新（毎時9分）の少し後
  workflow_dispatch:        # Actions の画面や、本人のPCから手動でも動かせる
  push:
    branches: [main]

permissions:
  contents: write   # 月1回の記録（keepalive.txt）を残すため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - name: 相場を取り込んでページを作る
        run: python update.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub は、60日間コミットのない公開リポジトリの定時実行を止める。
      # 最後のコミットから30日たっていたら、日付だけを書いた記録を残して止まらないようにする
      - name: 自動実行が止まらないよう、月1回だけ記録を残す
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "自動実行を止めないための定期記録"
            git push
          else
            echo "最後のコミットから30日たっていないので何もしない"
          fi
